<!--
  앱 아이콘 (브라우저 탭 파비콘).

  App Router는 `app/icon.svg`를 두면 알아서 <link rel="icon">을 박아 준다 —
  layout.tsx를 고칠 필요가 없다. 기존 `app/favicon.ico`(Next 기본값)보다 우선한다.

  데스크톱 설치본 아이콘(build/icon.svg → src-tauri/icons/*, `npx tauri icon`으로 생성)과
  같은 그림을 쓴다 — 달력 줄 넷(호박색)과 고리 둘(회색). 앱 안팎에서 아이콘이 갈라지지
  않게 하나의 소스를 그대로 맞춰 옮겼다(원본의 C2PA 메타데이터만 뺐다 — 파비콘은 매
  페이지 로드마다 받는 파일이라 가볍게 유지한다).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <circle cx="50" cy="50" r="26" fill="#C5CCD4" />
  <circle cx="206" cy="206" r="26" fill="#C5CCD4" />
  <rect x="102" y="24" width="130" height="52" rx="26" fill="#FFC043" />
  <rect x="24" y="102" width="208" height="52" rx="26" fill="#FFC043" />
  <rect x="24" y="180" width="130" height="52" rx="26" fill="#FFC043" />
</svg>
