<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C453"/>
      <stop offset="55%" stop-color="#D99A2B"/>
      <stop offset="100%" stop-color="#96600F"/>
    </linearGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C6414"/>
      <stop offset="100%" stop-color="#7C4E0E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE29A"/>
      <stop offset="100%" stop-color="#FFC13B"/>
    </linearGradient>
    <radialGradient id="gloss" cx="30%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#gloss)"/>
  <rect x="27" y="27" width="458" height="458" rx="109" fill="none" stroke="#FFE9B8" stroke-opacity="0.35" stroke-width="3"/>

  <!-- card drop shadow -->
  <rect x="112" y="176" width="304" height="264" rx="34" fill="#5C3A0A" opacity="0.28"/>

  <!-- binder rings -->
  <rect x="176" y="96" width="34" height="88" rx="17" fill="#7C4E0E"/>
  <rect x="302" y="96" width="34" height="88" rx="17" fill="#7C4E0E"/>

  <!-- card body -->
  <rect x="104" y="164" width="304" height="256" rx="34" fill="#FFFBF2"/>

  <!-- header band -->
  <path d="M104 198 a34 34 0 0 1 34-34 h236 a34 34 0 0 1 34 34 v40 h-304 z" fill="url(#band)"/>
  <rect x="176" y="118" width="34" height="66" rx="17" fill="#583809"/>
  <rect x="302" y="118" width="34" height="66" rx="17" fill="#583809"/>

  <!-- date grid -->
  <g fill="#EFE2C8">
    <rect x="132" y="266" width="52" height="52" rx="13"/>
    <rect x="330" y="266" width="52" height="52" rx="13"/>
    <rect x="132" y="336" width="52" height="52" rx="13"/>
    <rect x="196" y="336" width="52" height="52" rx="13"/>
    <rect x="330" y="336" width="52" height="52" rx="13"/>
  </g>

  <!-- the golden day -->
  <rect x="228" y="260" width="60" height="60" rx="15" fill="url(#gold)"/>
  <rect x="228" y="260" width="60" height="60" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>

  <!-- sparkle -->
  <path d="M368 232 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10 z" fill="#FFF6DD"/>
  <path d="M368 232 l10 22 22 10 -22 10 -10 22 -10-22 -22-10 22-10 z" fill="#FFD166" opacity="0.55"/>
</svg>
