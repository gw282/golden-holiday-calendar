[package]
name = "golden-holiday-calendar"
version = "0.6.0"
description = "Golden Holiday Calendar desktop shell"
authors = ["Golden Holiday Calendar"]
edition = "2021"

[lib]
name = "golden_holiday_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# 로컬 서버(127.0.0.1)만 찌르는 동기 폴링이라 tokio 비동기 스택 없이 가벼운 동기 클라이언트로 충분하다
ureq = { version = "2", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# 창 반투명은 Tauri 공식 API에 없어(Win32뿐 아니라 크로스플랫폼 API 자체가 없다)
# 레이어드 윈도우를 직접 다룬다. wry/webview2-com이 이미 물고 오는 크레이트라
# 새로 무거워지는 게 아니라 버전만 맞춰 직접 의존성으로 올린 것이다.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# 윈도우 토스트 알림의 발신자 이름 — AUMID(앱 식별자)에 매핑된 DisplayName을
# 레지스트리에 직접 등록해야 뜬다. 등록하지 않으면 Windows가 identifier 문자열
# ("com.goldenholidaycalendar.desktop")을 그대로 보여준다.
windows-registry = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
